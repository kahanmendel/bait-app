{% extends "base.html" %}
{% block title %}{{ 'עריכת' if reminder else 'הוסף' }} תזכורת{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:0 auto;">
    <h2 style="margin-bottom:24px;">{{ 'עריכת' if reminder else 'הוספת' }} תזכורת אישית</h2>
    <form method="POST">
        <div class="form-group">
            <label>כותרת</label>
            <input type="text" name="title" required
                   value="{{ reminder.title if reminder else '' }}"
                   placeholder="למשל: יום הולדת / ביקור רופא">
        </div>
        <div class="form-group">
            <label>הערה (אופציונלי)</label>
            <textarea name="message" rows="2"
                      placeholder="פרטים נוספים...">{{ reminder.message if reminder else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>תאריך</label>
            <input type="date" name="date" required
                   value="{{ reminder.gregorian_date if reminder else '' }}">
        </div>
        <div class="form-group">
            <label>שעה</label>
            <input type="time" name="time"
                   value="{{ reminder.time_of_day if reminder else '08:00' }}">
        </div>
        <div class="form-group">
            <label>תדירות חזרה</label>
            <select name="recurrence">
                {% for key, label in recurrence_labels.items() %}
                <option value="{{ key }}"
                    {% if reminder and reminder.recurrence == key %}selected{% endif %}>
                    {{ label }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex;gap:12px;">
            <button class="btn btn-success" style="flex:1">שמור</button>
            <a href="/reminders" class="btn btn-danger" style="flex:1;text-align:center;">ביטול</a>
        </div>
    </form>
</div>
{% endblock %}
