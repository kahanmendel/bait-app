{% extends "base.html" %}
{% block title %}כניסה{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto;">
    <h2 style="margin-bottom:24px;text-align:center;">כניסה למערכת</h2>
    <form method="POST">
        <div class="form-group">
            <label>מספר טלפון</label>
            <input type="tel" name="phone" required placeholder="05X-XXXXXXX"
                   style="direction:ltr;text-align:right;">
        </div>
        <div class="form-group">
            <label>PIN</label>
            <input type="password" name="pin" required placeholder="קוד PIN"
                   maxlength="8" inputmode="numeric">
        </div>
        <button class="btn btn-primary" style="width:100%">כניסה</button>
    </form>
    <p style="text-align:center;margin-top:16px;">
        אין חשבון? <a href="/register">הרשמה</a>
    </p>
</div>
{% endblock %}
